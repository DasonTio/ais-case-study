[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-patrec"
version = "0.1.0"
description = "Artificial Immune System pattern recognition for network intrusion traffic (V-Detector + CLONALG)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["ais_patrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
